<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tusher BD - Your Digital Solution</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-blue: #0084c7;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --chat-green: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
      overflow-x: hidden;
    }

    /* Gradient Line Bar */
    .top-bar {
      height: 4px;
      background: linear-gradient(90deg, #ed4899, #8b5cf6, #3b82f6);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 32px;
      font-weight: 900;
      color: #0072ff;
      font-style: italic;
      transform: skewX(-10deg);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.1;
    }

    .brand-text h1 span {
      color: #0072ff;
    }

    .brand-text p {
      font-size: 11px;
      color: #64748b;
    }

    .menu-btn {
      background: #f1f5f9;
      border: none;
      font-size: 22px;
      color: #334155;
      width: 44px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Slide Navigation Drawer */
    .nav-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 260px;
      height: 100%;
      background: #ffffff;
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      z-index: 200;
      transition: right 0.3s ease-in-out;
      padding: 20px;
    }

    .nav-drawer.active {
      right: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      float: right;
      cursor: pointer;
      color: #64748b;
    }

    .drawer-menu {
      list-style: none;
      margin-top: 50px;
    }

    .drawer-menu li {
      margin-bottom: 12px;
    }

    .drawer-menu a {
      text-decoration: none;
      color: #334155;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .drawer-menu a:hover {
      background: #f1f5f9;
      color: #0072ff;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    /* Custom Graphic Banner */
    .banner-graphic {
      width: 100%;
      background: linear-gradient(135deg, #071330 0%, #0c2656 50%, #0284c7 100%);
      color: #ffffff;
      padding: 22px 15px 18px 15px;
      text-align: center;
      position: relative;
    }

    .crown-icon {
      color: #fbbf24;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .banner-graphic h2 {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .banner-graphic h3 {
      font-size: 13px;
      color: #ffffff;
      font-weight: 600;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .banner-graphic .tagline {
      display: inline-block;
      background: #eab308;
      color: #000000;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .serv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .serv-item {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 2px;
      font-size: 9px;
      font-weight: 500;
    }

    .serv-item i {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
      color: #38bdf8;
    }

    .banner-order-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #ffffff;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
    }

    /* Blue Partner Button */
    .partner-section {
      padding: 16px 16px 8px 16px;
    }

    .partner-btn {
      width: 100%;
      background: #0084c7;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 132, 199, 0.25);
      transition: transform 0.2s;
    }

    .partner-btn:active {
      transform: scale(0.98);
    }

    /* Feature Grid (Cards) */
    .features-container {
      padding: 15px 20px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 15px;
    }

    .feature-card {
      text-align: center;
      background: transparent;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .feature-card:active {
      transform: scale(0.96);
    }

    .card-full {
      grid-column: span 2;
      width: 50%;
      margin: 0 auto;
    }

    /* Circular Icons */
    .icon-circle {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      font-size: 24px;
    }
