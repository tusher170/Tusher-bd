<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tusher BD - Your Digital Solution</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-blue: #0084c7;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --chat-green: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
      overflow-x: hidden;
    }

    /* Top Pink Gradient Line */
    .top-bar {
      height: 4px;
      background: linear-gradient(90deg, #ed4899, #8b5cf6, #3b82f6);
    }

    /* Header Structure */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 32px;
      font-weight: 900;
      color: #0072ff;
      font-style: italic;
      transform: skewX(-10deg);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.1;
    }

    .brand-text h1 span {
      color: #0072ff;
    }

    .brand-text p {
      font-size: 11px;
      color: #64748b;
    }

    .menu-btn {
      background: #f1f5f9;
      border: none;
      font-size: 22px;
      color: #334155;
      width: 44px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Functional Slide Navigation Menu */
    .nav-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 260px;
      height: 100%;
      background: #ffffff;
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      z-index: 200;
      transition: right 0.3s ease-in
